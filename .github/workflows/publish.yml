name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  # Re-run the full CI gate against the exact tagged commit
  # before the irreversible upload — PyPI forbids re-uploading a version.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing (no API token secret)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
