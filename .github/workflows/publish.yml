name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  # Re-run the full ruff + mypy + pytest gate against the exact tagged commit
  # before the irreversible upload — PyPI forbids re-uploading a version.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing (no API token secret)
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
