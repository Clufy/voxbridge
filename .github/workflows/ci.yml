name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # let publish.yml reuse this exact gate on the tagged commit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,docs]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src tests
      - name: Pytest
        run: pytest --cov=voxbridge --cov-fail-under=90
      - name: Docs build
        run: mkdocs build --strict
      - name: Package build
        run: python -m build && twine check dist/*
