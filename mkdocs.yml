site_name: voxbridge
site_description: One interface over multiple voice-agent platforms.
repo_url: https://github.com/Clufy/voxbridge
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Webhooks & tools: webhooks.md
  - Providers: providers.md
  - API reference: api.md
  - Changelog: changelog.md
# SDD plan/spec live under docs/ for repo history but aren't part of the site.
exclude_docs: |
  superpowers/
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
