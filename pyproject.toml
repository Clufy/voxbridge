[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxbridge"
dynamic = ["version"]
description = "Provider-agnostic Python SDK over the Vapi and Retell voice-agent platforms."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Aquib" }]
keywords = ["voice", "voice-agent", "vapi", "retell", "telephony", "sdk", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pytest-cov>=5", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "build", "twine", "fastapi>=0.110"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/Aquib/voxbridge"
Source = "https://github.com/Aquib/voxbridge"
Documentation = "https://aquib.github.io/voxbridge/"
Changelog = "https://github.com/Aquib/voxbridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/Aquib/voxbridge/issues"

[tool.hatch.version]
path = "src/voxbridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voxbridge"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers", ".claude", "docs/superpowers", ".github", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=voxbridge --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

# The shipped library (src) is fully strict. Tests stay type-checked but are
# exempt from require-return-annotation noise on every test function.
# ponytail: relax two rules for tests, not all of strict — real type bugs still fail.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
